      html,

        margin: 0;

        background: #08070d;
        overflow: hidden;
        touch-action: none;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #fff;

      #app,
      canvas {
        position: fixed;
        inset: 0;

      #hud {
        position: fixed;
        left: 16px;
        top: 12px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.75;
        pointer-events: none;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      }
      #hud b {
        font-style: italic;
        font-size: 16px;
        letter-spacing: 0.2em;
        color: #ff3f7a;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        letter-spacing: 0.3em;
        opacity: 0.7;
        /* Opacity runs on the compositor: it keeps pulsing while a long task blocks the main thread. */
        animation: loadpulse 1.4s ease-in-out infinite;
      }
      @keyframes loadpulse {
        50% {
          opacity: 0.25;
        }
      }
